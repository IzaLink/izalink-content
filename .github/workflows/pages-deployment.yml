name: Deploy IzaLink Content

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Afficher les fichiers les plus lourds
        run: |
          echo "=== Fichiers les plus lourds ==="
          find . -type f -printf "%s %p\n" | sort -nr | head -30
          echo "=== Fichiers supérieurs à 25 MiB ==="
          find . -type f -size +25M -print

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=izalink-content

      - name: Afficher sortie Wrangler
        if: always()
        env:
          OUTPUT: ${{ steps.deploy.outputs.command-output }}
          STDERR: ${{ steps.deploy.outputs.command-stderr }}
        run: |
          echo "=== OUTPUT ==="
          echo "$OUTPUT"
          echo "=== STDERR ==="
          echo "$STDERR"